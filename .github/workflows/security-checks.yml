name: Security and static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required application files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f js/app.js
          test -f js/complaints.js
          test -f css/style.css
          test -f css/complaints.css

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/complaints.js

      - name: Scan source for security problems
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = [
              p for p in Path('.').rglob('*')
              if p.is_file()
              and '.git' not in p.parts
              and p.suffix.lower() in {'.html', '.js', '.css'}
          ]

          checks = [
              ('insecure HTTP resource', re.compile(r'''(?:src|href)\s*=\s*["']http://''', re.I)),
              ('possible committed secret', re.compile(r'''(?:api[_-]?key|client[_-]?secret|private[_-]?key|access[_-]?token)\s*[:=]\s*["'][^"']{8,}''', re.I)),
              ('dynamic code execution', re.compile(r'''\beval\s*\(|new\s+Function\s*\(''')),
          ]

          problems = []
          for path in files:
              text = path.read_text(encoding='utf-8', errors='ignore')
              for label, pattern in checks:
                  if pattern.search(text):
                      problems.append(f'{path}: {label}')

          if problems:
              print('\n'.join(problems))
              sys.exit(1)

          print(f'Security scan passed for {len(files)} source files.')
          PY

      - name: Confirm HTTPS camera guidance
        shell: bash
        run: |
          grep -Eqi 'https|localhost' README.md
